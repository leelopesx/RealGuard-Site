<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>RealGuard</title>
    <meta name="description" content="RealGuard transforma a câmera da escola em presença automática, aviso aos pais pelo Telegram e alerta de segurança, com tudo processado dentro da AIBox Daten." />
    <link rel="icon" type="image/png" href="/assets/realguard-symbol.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Aplica o tema (salvo ou do sistema) antes do React carregar (evita piscar).
      // O CSS do modo claro depende só de html[data-theme="light"].
      var t = null;
      try { t = localStorage.getItem('rg_theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
